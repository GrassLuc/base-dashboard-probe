<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实际施工日历</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#182c2a;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1060px;margin:auto;padding:clamp(12px,3vw,32px)}small,footer,.legend{color:#52665e}header,.tools,.legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h1{margin:3px 0 0;font-size:clamp(20px,3vw,29px)}.badge{font-size:13px;color:#176648;background:#edf7ef;padding:5px 10px;border-radius:6px}.tools{margin:18px 0 12px}button{font:inherit;cursor:pointer;color:inherit;background:#fff;border:1px solid #baccc2;border-radius:5px;padding:5px 10px}button[aria-pressed=true]{background:#205d49;color:#fff;border-color:#205d49}.scroll{overflow-x:auto}table{width:100%;min-width:430px;border-spacing:2px;text-align:center;font-variant-numeric:tabular-nums}th,td{font-size:13px;padding:3px 2px}th small{display:block;font-size:11px}th:first-child{text-align:left;min-width:140px;position:sticky;left:0;background:white;z-index:1}.cell{min-width:34px;height:39px;padding:0}.cell button{border:0;border-radius:3px;width:100%;height:100%;padding:0;font-weight:600}.work{background:#277455;color:white}.gap{background:#e9f3ed;color:#8ba999}.adjust{background:repeating-linear-gradient(130deg,#e3efe6 0 4px,#fafcf9 4px 8px);color:#214d38}.week{color:#745b8d}.legend,footer{font-size:12px}.legend{margin:10px 0}.detail{background:#f3f7f4;border-radius:5px;padding:9px 12px;margin:10px 0}.error{color:#a13025}button:focus-visible{outline:2px solid #3564ab;outline-offset:1px}[hidden]{display:none!important}
</style>
<main><header><div><h1>实际施工日历</h1></div><strong class="badge" id="total">读取中</strong></header>
<div class="tools"><button id="work" aria-pressed="true">施工记录</button><button id="progress" aria-pressed="false">累计完成率</button><button id="save" hidden>添加到仪表盘</button></div>
<div class="scroll"><table aria-label="逐日施工报量"><thead><tr id="days"></tr></thead><tbody id="cells"></tbody></table></div>
<div class="legend" id="legend"></div><div class="detail" id="detail" aria-live="polite">正在读取开发试验报量…</div><footer id="source"></footer></main>
<script src="plugin.js"></script></html>
